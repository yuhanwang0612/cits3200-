<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .login-wrap { max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
    .login-card { padding: 1.5rem; border: 1px solid #ddd; border-radius: 8px; }
    .login-card h1 { font-size: 1.25rem; margin-top: 0; }
    .login-card label { display: block; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .login-card input[type=password] {
      width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px;
      box-sizing: border-box; margin-bottom: 0.9rem; }
    .err { color: #b00020; font-size: 0.9rem; margin-bottom: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Admin login</h1>
      <div id="err" class="err" hidden>Incorrect password. Try again.</div>
      <form method="POST" action="/admin/login">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required>
        <button class="btn" type="submit">Log in</button>
      </form>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("err").hidden = false;
    }
  </script>
</body>
</html>
